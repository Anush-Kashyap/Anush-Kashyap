<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOIDCADE // Retro 8-Bit Arcade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #050505;
      color: #39ff14;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* CRT scanline effect */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 100;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }

    .cabinet {
      background: #111;
      border: 4px solid #39ff14;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.8);
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .marquee {
      font-size: 14px;
      color: #39ff14;
      text-shadow: 0 0 8px #39ff14;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 10px;
      color: #fff;
    }

    canvas {
      background: #000;
      border: 2px solid #222;
      border-radius: 4px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
    }

    .controls {
      margin-top: 15px;
      font-size: 9px;
      color: #888;
      line-height: 1.6;
    }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 220px;
      margin: 15px auto 0;
    }

    .btn {
      background: #222;
      border: 2px solid #39ff14;
      color: #39ff14;
      font-family: inherit;
      padding: 10px;
      font-size: 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:active {
      background: #39ff14;
      color: #000;
    }

    @media (max-width: 600px) {
      .mobile-controls { display: grid; }
    }

    a.back-link {
      color: #39ff14;
      font-size: 10px;
      margin-top: 20px;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
    }
    a.back-link:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="cabinet">
    <div class="marquee">👾 ANUSH // VOIDCADE 👾</div>
    <div class="score-board">
      <div>SCORE: <span id="score">0000</span></div>
      <div>HIGH: <span id="highScore">1200</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
      CONTROLS: [ ARROW KEYS ] or [ W A S D ]<br>
      EAT GREEN BUGS • DODGE THE GLITCH WALLS
    </div>

    <div class="mobile-controls">
      <div></div>
      <button class="btn" onclick="move('UP')">▲</button>
      <div></div>
      <button class="btn" onclick="move('LEFT')">◄</button>
      <button class="btn" onclick="move('DOWN')">▼</button>
      <button class="btn" onclick="move('RIGHT')">►</button>
    </div>
  </div>

  <a class="back-link" href="https://github.com/Anush-Kashyap">← RETURN TO GITHUB PROFILE</a>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let velocity = { x: 0, y: 0 };
    let food = { x: 15, y: 15 };
    let score = 0;
    let highScore = localStorage.getItem('voidcade_high') || 1200;
    highScoreEl.innerText = highScore;

    let gameRunning = false;
    let gameLoop;

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      velocity = { x: 1, y: 0 };
      score = 0;
      scoreEl.innerText = '0000';
      placeFood();
      gameRunning = true;
    }

    function placeFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          placeFood();
          break;
        }
      }
    }

    function update() {
      if (!gameRunning) return;

      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Food collision
      if (head.x === food.x && head.y === food.y) {
        score += 100;
        scoreEl.innerText = score.toString().padStart(4, '0');
        if (score > highScore) {
          highScore = score;
          highScoreEl.innerText = highScore;
          localStorage.setItem('voidcade_high', highScore);
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid subtle lines
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food (Pixelated Bug)
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 8;
      ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

      // Draw Snake
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? '#39ff14' : '#00aa33';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = index === 0 ? 10 : 4;
        ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
      ctx.shadowBlur = 0;

      if (!gameRunning) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#39ff14';
        ctx.font = '14px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('PRESS ANY KEY', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillText('TO START', canvas.width / 2, canvas.height / 2 + 15);
      }
    }

    function gameOver() {
      gameRunning = false;
    }

    function gameStep() {
      update();
      draw();
    }

    setInterval(gameStep, 100);

    function move(dir) {
      if (!gameRunning) {
        resetGame();
        return;
      }
      if (dir === 'UP' && velocity.y === 0) velocity = { x: 0, y: -1 };
      if (dir === 'DOWN' && velocity.y === 0) velocity = { x: 0, y: 1 };
      if (dir === 'LEFT' && velocity.x === 0) velocity = { x: -1, y: 0 };
      if (dir === 'RIGHT' && velocity.x === 0) velocity = { x: 1, y: 0 };
    }

    window.addEventListener('keydown', e => {
      if (!gameRunning) {
        resetGame();
        return;
      }
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': move('UP'); break;
        case 'ArrowDown': case 's': case 'S': move('DOWN'); break;
        case 'ArrowLeft': case 'a': case 'A': move('LEFT'); break;
        case 'ArrowRight': case 'd': case 'D': move('RIGHT'); break;
      }
    });

    draw();
  </script>
</body>
</html>
